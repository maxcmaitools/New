name: Morning Briefing Email

on:
  schedule:
    # 08:00 UK time. We run at 07:00 UTC (= 08:00 GMT in winter).
    # BST (summer) is UTC+1 so this fires at 08:00 BST too — perfect.
    - cron: '0 7 * * *'
  workflow_dispatch:   # also allows manual "Run workflow" from the GitHub Actions UI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true   # suppress Node.js 20 deprecation warnings

jobs:
  send-briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4.2.2

      - name: Set up Python 3.11
        uses: actions/setup-python@v5.4.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install anthropic

      - name: Check required secrets are present
        run: |
          missing=""
          [ -z "$ANTHROPIC_API_KEY" ]  && missing="$missing ANTHROPIC_API_KEY"
          [ -z "$SMTP_HOST" ]          && missing="$missing SMTP_HOST"
          [ -z "$SMTP_USER" ]          && missing="$missing SMTP_USER"
          [ -z "$SMTP_PASSWORD" ]      && missing="$missing SMTP_PASSWORD"
          if [ -n "$missing" ]; then
            echo "ERROR: The following GitHub Secrets are not set:$missing"
            echo ""
            echo "Go to: Settings → Secrets and variables → Actions → New repository secret"
            echo "Required secrets: ANTHROPIC_API_KEY, SMTP_HOST, SMTP_PORT, SMTP_TLS,"
            echo "                  SMTP_USER, SMTP_PASSWORD, BRIEFING_FROM_EMAIL"
            exit 1
          fi
          echo "All required secrets present ✓"
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SMTP_HOST:         ${{ secrets.SMTP_HOST }}
          SMTP_USER:         ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD:     ${{ secrets.SMTP_PASSWORD }}

      - name: Run morning briefing
        env:
          ANTHROPIC_API_KEY:   ${{ secrets.ANTHROPIC_API_KEY }}
          SMTP_HOST:           ${{ secrets.SMTP_HOST }}
          SMTP_PORT:           ${{ secrets.SMTP_PORT }}
          SMTP_TLS:            ${{ secrets.SMTP_TLS }}
          SMTP_USER:           ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD:       ${{ secrets.SMTP_PASSWORD }}
          BRIEFING_FROM_EMAIL: ${{ secrets.BRIEFING_FROM_EMAIL }}
        run: python morning_briefing.py

      - name: Upload HTML preview as artifact
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: briefing-${{ github.run_number }}
          path: briefing_preview.html
          retention-days: 7
