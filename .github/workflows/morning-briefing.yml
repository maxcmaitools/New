name: Morning Briefing Email

on:
  schedule:
    # 08:00 UK time year-round (GitHub Actions cron is always UTC):
    - cron: '0 7 * 3,4,5,6,7,8,9,10 *'   # Mar–Oct: BST (UTC+1) → 07:00 UTC = 08:00 BST
    - cron: '0 8 * 1,2,11,12 *'           # Nov–Feb: GMT (UTC+0) → 08:00 UTC = 08:00 GMT
  workflow_dispatch:        # also allows manual Run from the GitHub Actions UI

jobs:
  send-briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install anthropic

      - name: Verify secrets
        run: |
          ok=1
          [ -z "$ANTHROPIC_API_KEY" ] && echo "::error::MISSING secret: ANTHROPIC_API_KEY"  && ok=0
          [ -z "$SMTP_HOST" ]         && echo "::error::MISSING secret: SMTP_HOST"           && ok=0
          [ -z "$SMTP_USER" ]         && echo "::error::MISSING secret: SMTP_USER"           && ok=0
          [ -z "$SMTP_PASSWORD" ]     && echo "::error::MISSING secret: SMTP_PASSWORD"       && ok=0
          [ $ok -eq 0 ] && echo "Add the missing secrets at: Settings → Secrets and variables → Actions" && exit 1
          echo "Secrets present: ANTHROPIC_API_KEY(${#ANTHROPIC_API_KEY}chars) SMTP_HOST=$SMTP_HOST SMTP_USER=$SMTP_USER SMTP_PORT=${SMTP_PORT:-auto} SMTP_TLS=${SMTP_TLS:-false}"
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SMTP_HOST:         ${{ secrets.SMTP_HOST }}
          SMTP_USER:         ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD:     ${{ secrets.SMTP_PASSWORD }}
          SMTP_PORT:         ${{ secrets.SMTP_PORT }}
          SMTP_TLS:          ${{ secrets.SMTP_TLS }}

      - name: Run briefing
        env:
          ANTHROPIC_API_KEY:   ${{ secrets.ANTHROPIC_API_KEY }}
          SMTP_HOST:           ${{ secrets.SMTP_HOST }}
          SMTP_PORT:           ${{ secrets.SMTP_PORT }}
          SMTP_TLS:            ${{ secrets.SMTP_TLS }}
          SMTP_USER:           ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD:       ${{ secrets.SMTP_PASSWORD }}
          BRIEFING_FROM_EMAIL: ${{ secrets.BRIEFING_FROM_EMAIL }}
        run: python -u morning_briefing.py

      - name: Upload HTML preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: briefing-${{ github.run_number }}
          path: briefing_preview.html
          retention-days: 7
